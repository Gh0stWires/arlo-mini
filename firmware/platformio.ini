[env:unihiker]
platform = https://github.com/DFRobot/platform-unihiker.git
board = unihiker_k10
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^6.21.5
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Flash the English K10 speech model required by EN_MODE in main.cpp.
    ; Use Model=None only for a diagnostics build without wake-word ASR.
    -DModel=EN
    ; Boot-loop diagnosis: change ONE to 0, rebuild and upload.
    ; Disabling a subsystem prevents conversations but helps isolate resets.
    -DARLO_ENABLE_SD=1
    -DARLO_ENABLE_ASR=1
    -DARLO_ENABLE_WIFI=1
    ; Temporary display isolation test; set to 0 for the full firmware.
    -DARLO_SCREEN_SMOKE=0
    -DARLO_HOLD_SCREEN=0
